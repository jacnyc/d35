<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy birthday Dylan!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #14204a;
    --pink: #ff8fc8;
    --yellow: #ffe066;
    --ink: #3a1f33;
    --hot: #ff2e93;
    --bright: #2b4aa8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Comic Neue", "Comic Sans MS", cursive;
    color: var(--ink);
    background: var(--pink);
    -webkit-font-smoothing: antialiased;
  }
  section { padding: 56px 16px; }
  .wrap { max-width: 480px; margin: 0 auto; }
  h2 { font-size: 34px; text-align: center; margin-bottom: 28px; color: #fff; text-shadow: 2px 2px 0 rgba(0,0,0,.12); }

  /* ---------- Program (above) ---------- */
  #program { background: linear-gradient(to bottom, var(--blue) 0%, var(--blue) 40%, var(--pink) 100%); padding-top: 72px; }
  .program { list-style: none; }
  #program { color: #fff; }
  .program li { padding: 10px 0; display: flex; gap: 16px; align-items: baseline; font-size: 19px; }
  .program .time { font-weight: 700; min-width: 64px; }
  .program .note { display: block; font-size: 16px; opacity: .8; margin-top: 2px; }

  /* ---------- Landing ---------- */
  #home {
    position: relative; min-height: 100svh; padding: 0 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    background: var(--pink);
  }
  .arrow {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: #fff; text-decoration: none; font-weight: 700; font-size: 18px;
    padding: 20px; -webkit-tap-highlight-color: transparent;
  }
  .arrow.up { padding-top: calc(20px + env(safe-area-inset-top)); animation: nudgeUp 1.6s ease-in-out infinite; }
  .arrow.down { color: var(--bright); padding-bottom: calc(20px + env(safe-area-inset-bottom)); animation: nudgeDown 1.6s ease-in-out infinite; }
  .arrow svg { width: 28px; height: 28px; }
  @keyframes nudgeUp   { 50% { transform: translateY(-6px); } }
  @keyframes nudgeDown { 50% { transform: translateY(6px); } }

  h1 {
    font-size: clamp(48px, 15vw, 72px); line-height: 1.05; text-align: center;
    color: var(--hot); font-weight: 700;
    text-shadow: 3px 3px 0 #fff;
  }
  h1 .word { display: inline-block; white-space: nowrap; }
  h1 .ch { display: inline-block; animation: wobble 1.4s ease-in-out infinite; }
  @keyframes wobble {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50%      { transform: translateY(-8px) rotate(4deg); }
  }
  #confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* ---------- Wishes (below) ---------- */
  #wishes { background: linear-gradient(to bottom, var(--pink) 0%, var(--yellow) 30%, var(--yellow) 100%); padding-bottom: 80px; }
  .tiles { display: flex; flex-direction: column; gap: 20px; }
  .tile {
    border: 0; padding: 0; background: #fff; border-radius: 22px; overflow: hidden;
    cursor: pointer; text-align: left; font: inherit; color: inherit;
    box-shadow: 0 4px 0 rgba(0,0,0,.08);
    -webkit-tap-highlight-color: transparent; transition: transform .15s;
  }
  .tile:active { transform: scale(.98); }
  .tile { display: block; width: 100%; }
  .tile .img { position: relative; aspect-ratio: 3 / 4; background: var(--blue); }
  #wishes h2 { color: var(--blue); text-shadow: none; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .play {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 76px; height: 76px; border-radius: 50%;
    background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.6);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    display: grid; place-items: center;
  }
  .tile .play::after {
    content: ""; margin-left: 6px;
    border-left: 24px solid rgba(255,255,255,.95); border-top: 15px solid transparent; border-bottom: 15px solid transparent;
  }
  .caption { font-size: 18px; font-weight: 700; text-align: center; margin: 12px 0 10px; color: var(--bright); }

  /* ---------- Fullscreen player ---------- */
  .player { position: fixed; inset: 0; background: #000; z-index: 10; display: none; align-items: center; justify-content: center; }
  .player.open { display: flex; }
  .player video { width: 100%; height: 100%; object-fit: contain; }
  .player .close {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 12px;
    width: 44px; height: 44px; border-radius: 50%; border: 0;
    background: rgba(255,255,255,.25); color: #fff; font-size: 28px; line-height: 1; cursor: pointer;
  }
</style>
</head>
<body>

<section id="program">
  <div class="wrap">
    <h2>program</h2>
    <ul class="program" id="programList"></ul>
  </div>
</section>

<section id="home">
  <canvas id="confetti"></canvas>
  <a class="arrow up" href="#program">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    program
  </a>
  <h1 id="title">Happy birthday Dylan!</h1>
  <a class="arrow down" href="#wishes">
    birthday wishes
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
  </a>
</section>

<section id="wishes">
  <div class="wrap">
    <div class="tiles" id="tiles"></div>
  </div>
</section>

<div class="player" id="player">
  <video id="video" controls playsinline></video>
  <button class="close" id="close" aria-label="Close">&times;</button>
</div>

<script>
  /* ===== EDIT HERE ===== */
  const PROGRAM = [
    { time: "11:00", what: "good morning!" },
    { time: "13:15", what: "leave for afternoon activity" },
    { time: "14:00", what: "activity!", note: "wear long pants and closed shoes (no thongs, sorry)" },
    { time: "20:00", what: "evening surprise!" },
  ];
  // photo in /photos, video in /videos
  const PEOPLE = [
    { caption: "from your family",               photo: "photos/1.jpg", video: "videos/1.mp4" },
    { caption: "and mine",                       photo: "photos/2.jpg", video: "videos/2.mp4" },
    { caption: "from these friends from all over", photo: "photos/4.jpg", video: "videos/4.mp4" },
    { caption: "and these legends in Amsterdam", photo: "photos/5.jpg", video: "videos/5.mp4" },
    { caption: "aaand this Bonus courtesy of Ben", photo: "photos/6.jpg", video: "videos/6.mp4" },
  ];
  /* ===== END EDIT ===== */

  // Program
  document.getElementById("programList").innerHTML = PROGRAM.map(p =>
    `<li><span class="time">${p.time}</span><span class="what">${p.what}${p.note ? `<span class="note">${p.note}</span>` : ""}</span></li>`).join("");

  // Wobbly title: split into letters, keep words together
  const title = document.getElementById("title");
  let i = 0;
  title.innerHTML = title.textContent.split(" ").map(w =>
    `<span class="word">${[...w].map(c => `<span class="ch" style="animation-delay:${(i++ * 0.08).toFixed(2)}s">${c}</span>`).join("")}</span>`
  ).join(" ");

  // Video tiles
  const tiles = document.getElementById("tiles");
  PEOPLE.forEach(p => {
    const b = document.createElement("button");
    b.className = "tile";
    b.innerHTML = `
      <div class="img">
        <img src="${p.photo}" alt="" loading="lazy" onerror="this.remove()">
        <span class="play"></span>
      </div>`;
    b.onclick = () => openVideo(p.video);
    const item = document.createElement("div");
    const cap = document.createElement("p");
    cap.className = "caption"; cap.textContent = p.caption;
    item.append(cap, b);
    tiles.appendChild(item);
  });

  // Fullscreen player
  const player = document.getElementById("player"), video = document.getElementById("video");
  function openVideo(src) {
    video.src = src; player.classList.add("open");
    document.body.style.overflow = "hidden"; video.play().catch(() => {});
  }
  function closeVideo() {
    video.pause(); video.removeAttribute("src"); video.load();
    player.classList.remove("open"); document.body.style.overflow = "";
  }
  document.getElementById("close").onclick = closeVideo;
  video.onended = closeVideo;

  // Open on the landing screen, not the top of the page
  history.scrollRestoration = "manual";
  const home = document.getElementById("home");
  window.addEventListener("load", () => {
    document.documentElement.style.scrollBehavior = "auto";
    window.scrollTo(0, home.offsetTop);
    document.documentElement.style.scrollBehavior = "";
    confetti();
  });

  // Confetti
  function confetti() {
    const cv = document.getElementById("confetti"), ctx = cv.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    const W = cv.width = home.clientWidth * dpr, H = cv.height = home.clientHeight * dpr;
    const colors = ["#ff2e93", "#14204a", "#ffe066", "#ffffff", "#b388ff"];
    const bits = Array.from({ length: 140 }, () => ({
      x: Math.random() * W, y: -Math.random() * H,
      w: (6 + Math.random() * 6) * dpr, h: (10 + Math.random() * 8) * dpr,
      vy: (2 + Math.random() * 3) * dpr, vx: (Math.random() - .5) * 2 * dpr,
      r: Math.random() * Math.PI, vr: (Math.random() - .5) * .2,
      c: colors[(Math.random() * colors.length) | 0]
    }));
    const end = performance.now() + 6000;
    (function tick(t) {
      ctx.clearRect(0, 0, W, H);
      let alive = false;
      bits.forEach(b => {
        b.y += b.vy; b.x += b.vx + Math.sin(b.y / 40) * dpr; b.r += b.vr;
        if (b.y > H && t < end) b.y = -20;
        if (b.y <= H) alive = true;
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
        ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore();
      });
      if (alive) requestAnimationFrame(tick);
    })(performance.now());
  }
</script>
</body>
</html>
